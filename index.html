<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Knight</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero" id="hero">
    <div class="hero-shade"></div>
    <div class="hero-inner">
      <img class="avatar" id="avatar" src="photo.jpg" alt="Black Knight profile photo">
      <h1 id="name">Black Knight</h1>
      <p class="bio" id="bio">Silence is the sharpest blade.</p>
    </div>
  </header>

  <main class="feed" id="feed" aria-live="polite">
    <p class="state" id="state">Loading posts…</p>
  </main>

  <footer class="foot">Black Knight</footer>

  <script src="script.js"></script>
</body>
</html>
